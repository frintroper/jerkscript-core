name: Lean CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan Toolchain Manager
      run: |
        curl -sSfL https://leanprover.org | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    # T.O.N.E.-Fix: Die exakte Lean-Version aktiv in den Runner-Raum laden
    - name: Install Specific Lean Toolchain
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd LeanProject
        elan toolchain install $(cat lean-toolchain)

    - name: Generate Manifest and Build Lean Project
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd LeanProject
        lake update
        lake build

