name: Lean CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # T.O.N.E.-Fix: Alles in einem Block, damit der PATH zu elan absolut stabil bleibt
    - name: Autarkic Elan Setup and Lake Build
      run: |
        # 1. Elan ohne Interaktion installieren
        curl -sSfL https://leanprover.org | sh -s -- -y --default-toolchain none
        
        # 2. Elan-Pfad für diesen spezifischen Prozess erzwingen
        export PATH="$HOME/.elan/bin:$PATH"
        
        # 3. In das Projektverzeichnis wechseln
        cd LeanProject
        
        # 4. Toolchain direkt basierend auf der lean-toolchain-Datei installieren
        elan toolchain install
        
        # 5. Manifest erzeugen und das Projekt fehlerfrei kompilieren
        lake update
        lake build
