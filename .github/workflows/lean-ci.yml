name: Lean CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # T.O.N.E.-Fix: Autarke Elan-Installation direkt über das offizielle Shell-Skript, vorbei an der verbuggten Action
    - name: Install Elan Toolchain Manager
      run: |
        curl -sSfL https://leanprover.org | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    # Manifest generieren UND direkt bauen in einem Rutsch, direkt im richtigen Ordner
    - name: Generate Manifest and Build Lean Project
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd LeanProject
        lake update
        lake build
