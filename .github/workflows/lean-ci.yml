name: Lean CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan & Lean
      uses: leanprover/lean-action@v1

    - name: Build Lean Project
      run: |
        cd LeanProject
        lake build
