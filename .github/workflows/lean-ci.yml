name: Lean CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan & Lean
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: 'LeanProject'

    # T.O.N.E.-Fix: Automatisches Generieren des fehlenden Manifests im Runner-Raum
    - name: Update Lake Dependencies
      run: |
        cd LeanProject
        lake update

    - name: Build Lean Project
      run: |
        cd LeanProject
        lake build
