name: Lean CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan & Lean
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: 'LeanProject'
        # T.O.N.E.-Fix: Verhindert, dass die Action automatisch abstürzt, bevor wir das Manifest bauen
        auto-config: false
        build: false

    # Jetzt erzeugen wir das Manifest manuell im sauberen Raum
    - name: Generate Lake Manifest
      run: |
        cd LeanProject
        lake update

    # Jetzt bauen wir das Projekt händisch
    - name: Build Lean Project
      run: |
        cd LeanProject
        lake build


    - name: Build Lean Project
      run: |
        cd LeanProject
        lake build
